[project]
name = "mweppc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "capstone>=5",
]

[dependency-groups]
dev = [
    "clang-format==23.1.3",
    "ruff==0.17.1",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731", "E741"]
